<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%" height="330">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .terminal-window {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      }
      
      .prompt {
        fill: #8968CD;
        font-weight: 700;
      }
      
      .cmd {
        fill: #ffffff;
        font-weight: 500;
      }
      
      .key {
        fill: #00ffff;
      }
      
      .val {
        fill: #f0f6fc;
      }
      
      .val-green {
        fill: #7ee787;
      }
      
      .val-cyan {
        fill: #a5d6ff;
      }
      
      .bracket {
        fill: #d2a8ff;
      }
      
      .comma {
        fill: #7d8590;
      }
      
      .comment {
        fill: #7d8590;
        font-style: italic;
        font-size: 12.5px;
      }
      
      .cursor {
        fill: #00ffff;
        animation: cursor-blink 0.8s step-end infinite;
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Sequential reveal keyframes over 10s loop */
      .anim-cmd {
        animation: reveal-cmd 10s infinite ease-out;
      }
      .anim-l1 {
        animation: reveal-l1 10s infinite ease-out;
      }
      .anim-l2 {
        animation: reveal-l2 10s infinite ease-out;
      }
      .anim-l3 {
        animation: reveal-l3 10s infinite ease-out;
      }
      .anim-l4 {
        animation: reveal-l4 10s infinite ease-out;
      }
      .anim-l5 {
        animation: reveal-l5 10s infinite ease-out;
      }
      .anim-l6 {
        animation: reveal-l6 10s infinite ease-out;
      }
      .anim-hint {
        animation: reveal-hint 10s infinite ease-out;
      }
      .anim-end {
        animation: reveal-end 10s infinite ease-out;
      }

      @keyframes reveal-cmd {
        0%, 8% { opacity: 0; transform: translateY(-2px); }
        12%, 95% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-l1 {
        0%, 18% { opacity: 0; }
        22%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-l2 {
        0%, 23% { opacity: 0; }
        27%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-l3 {
        0%, 28% { opacity: 0; }
        32%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-l4 {
        0%, 33% { opacity: 0; }
        37%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-l5 {
        0%, 38% { opacity: 0; }
        42%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-l6 {
        0%, 43% { opacity: 0; }
        47%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-hint {
        0%, 49% { opacity: 0; }
        53%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      @keyframes reveal-end {
        0%, 55% { opacity: 0; }
        58%, 95% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Container with Neon Purple Border & Subtle Drop Shadow -->
  <rect x="2" y="2" width="696" height="326" rx="10" fill="#090a10" stroke="#8968CD" stroke-opacity="0.45" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 688 2 Q 698 2 698 12 L 698 38 L 2 38 Z" fill="#12131c" />
  <line x1="2" y1="38" x2="698" y2="38" stroke="#1e2030" stroke-width="1" />
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="5.5" fill="#27c93f" />
  
  <!-- Terminal Title -->
  <text x="350" y="24" fill="#7d8590" font-family="'Fira Code', monospace" font-size="12" font-weight="500" text-anchor="middle">sumit0xff@mainframe: ~ (bash)</text>

  <!-- Terminal Content -->
  <g class="terminal-window" font-size="13.5" transform="translate(25, 70)">
    
    <!-- Command Line -->
    <g class="anim-cmd">
      <text y="0">
        <tspan class="prompt">@whoami:~$</tspan>
        <tspan class="cmd"> curl -s https://sumit0xff.vercel.app/api/status</tspan>
      </text>
    </g>

    <!-- JSON Opening Bracket -->
    <g class="anim-l1">
      <text y="26"><tspan class="bracket">{</tspan></text>
    </g>

    <!-- Status Line -->
    <g class="anim-l2">
      <text y="50">  <tspan class="key">"status":</tspan> <tspan class="val-green">"online"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Identity Line -->
    <g class="anim-l3">
      <text y="74">  <tspan class="key">"identity":</tspan> <tspan class="val">"sumit0xff"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Mission Line -->
    <g class="anim-l4">
      <text y="98">  <tspan class="key">"mission":</tspan> <tspan class="val-cyan">"building resilient systems &amp; exploring web3"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Message Line -->
    <g class="anim-l5">
      <text y="122">  <tspan class="key">"message":</tspan> <tspan class="val">"Hello, friend. Welcome to my profile."</tspan></text>
    </g>

    <!-- JSON Closing Bracket -->
    <g class="anim-l6">
      <text y="146"><tspan class="bracket">}</tspan></text>
    </g>

    <!-- Shell Hint Comment -->
    <g class="anim-hint">
      <text y="180" class="comment">// tip: run in your shell: curl -s https://sumit0xff.vercel.app/api/status</text>
    </g>

    <!-- Active Bottom Prompt with Blinking Cursor -->
    <g class="anim-end">
      <text y="212">
        <tspan class="prompt">@whoami:~$</tspan>
        <tspan class="cursor" dx="8">█</tspan>
      </text>
    </g>

  </g>
</svg>
