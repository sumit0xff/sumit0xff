<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" width="100%" height="315">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .terminal-window {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      }
      
      .prompt {
        fill: #8968CD;
        font-weight: 700;
      }
      
      .cmd {
        fill: #ffffff;
        font-weight: 500;
      }
      
      .key {
        fill: #00ffff;
      }
      
      .val {
        fill: #f0f6fc;
      }
      
      .val-green {
        fill: #7ee787;
      }
      
      .bracket {
        fill: #d2a8ff;
      }
      
      .comma {
        fill: #7d8590;
      }
      
      .comment {
        fill: #8b949e;
        font-style: italic;
        font-size: 12px;
      }
      
      .cursor {
        fill: #00ffff;
        animation: cursor-blink 0.8s step-end infinite;
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Non-looping entrance: each line reveals ONCE and stays permanently visible */
      .anim-cmd {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 0.2s forwards;
      }
      .anim-l1 {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 0.5s forwards;
      }
      .anim-l2 {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 0.8s forwards;
      }
      .anim-l3 {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 1.1s forwards;
      }
      .anim-l4 {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 1.4s forwards;
      }
      .anim-l5 {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 1.7s forwards;
      }
      .anim-l6 {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 2.0s forwards;
      }
      .anim-hint {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 2.4s forwards;
      }
      .anim-end {
        opacity: 0;
        animation: reveal-line 0.35s ease-out 2.8s forwards;
      }

      @keyframes reveal-line {
        0% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-cmd, .anim-l1, .anim-l2, .anim-l3, .anim-l4, .anim-l5, .anim-l6, .anim-hint, .anim-end {
          opacity: 1 !important;
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Terminal Container with Medium Purple Border -->
  <rect x="2" y="2" width="696" height="311" rx="10" fill="#090a10" stroke="#8968CD" stroke-opacity="0.45" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 688 2 Q 698 2 698 12 L 698 38 L 2 38 Z" fill="#12131c" />
  <line x1="2" y1="38" x2="698" y2="38" stroke="#1e2030" stroke-width="1" />
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="5.5" fill="#27c93f" />
  
  <!-- Terminal Title -->
  <text x="350" y="24" fill="#7d8590" font-family="'Fira Code', monospace" font-size="12" font-weight="500" text-anchor="middle">sumit0xff@arch: ~</text>

  <!-- Terminal Content -->
  <g class="terminal-window" font-size="13.5" transform="translate(25, 70)">
    
    <!-- Command Line -->
    <g class="anim-cmd">
      <text y="0">
        <tspan class="prompt">sumit0xff@arch:~$</tspan>
        <tspan class="cmd"> curl -s https://sumit0xff.vercel.app/api/ip</tspan>
      </text>
    </g>

    <!-- JSON Opening Bracket -->
    <g class="anim-l1">
      <text y="26"><tspan class="bracket">{</tspan></text>
    </g>

    <!-- IP Line -->
    <g class="anim-l2">
      <text y="50">  <tspan class="key">"ip":</tspan> <tspan class="val-green">"127.0.0.1"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- City Line -->
    <g class="anim-l3">
      <text y="74">  <tspan class="key">"city":</tspan> <tspan class="val">"localhost"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Country Line -->
    <g class="anim-l4">
      <text y="98">  <tspan class="key">"country":</tspan> <tspan class="val">"earth"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Status Line -->
    <g class="anim-l5">
      <text y="122">  <tspan class="key">"status":</tspan> <tspan class="val-green">"online"</tspan></text>
    </g>

    <!-- JSON Closing Bracket -->
    <g class="anim-l6">
      <text y="146"><tspan class="bracket">}</tspan></text>
    </g>

    <!-- Shell Hint Comment -->
    <g class="anim-hint">
      <text y="178" class="comment">// type 'curl -s https://sumit0xff.vercel.app/api/ip' in your terminal to see your real IP</text>
    </g>

    <!-- Active Bottom Prompt with Blinking Cursor -->
    <g class="anim-end">
      <text y="208">
        <tspan class="prompt">sumit0xff@arch:~$</tspan>
        <tspan class="cursor" dx="8">█</tspan>
      </text>
    </g>

  </g>
</svg>
