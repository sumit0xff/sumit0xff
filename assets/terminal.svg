<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="window-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151d" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>

    <linearGradient id="header-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1e28" />
      <stop offset="100%" stop-color="#131620" />
    </linearGradient>

    <!-- Clip path to keep header and body within refined rounded corners -->
    <clipPath id="window-clip">
      <rect x="1" y="1" width="678" height="358" rx="10" ry="10" />
    </clipPath>

    <style>
      .term-text {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 24px;
        letter-spacing: 0.15px;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      .term-title {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Liberation Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 0.3px;
      }

      /* Command Line Styling */
      .prompt-user { fill: #7ee787; font-weight: 600; }
      .prompt-at   { fill: #6e7681; }
      .prompt-host { fill: #7ee787; font-weight: 500; }
      .prompt-colon{ fill: #6e7681; }
      .prompt-path { fill: #79c0ff; font-weight: 500; }
      .prompt-sym  { fill: #8b949e; font-weight: 600; }
      .cmd-bin     { fill: #f0883e; font-weight: 500; }
      .cmd-flag    { fill: #8b949e; }
      .cmd-arg     { fill: #a5d6ff; }

      /* JSON Syntax Highlighting */
      .json-bracket { fill: #d2a8ff; font-weight: 500; }
      .json-key     { fill: #79c0ff; }
      .json-punct   { fill: #7d8590; }
      .json-val     { fill: #a5d6ff; }
      .json-status  { fill: #7ee787; font-weight: 600; }
      .json-uptime  { fill: #7ee787; font-weight: 600; }
      .json-quote   { fill: #f0f6fc; font-weight: 400; }

      /* Blinking Cursor */
      .term-cursor {
        fill: #58a6ff;
        animation: cursor-blink 1.05s step-end infinite;
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .term-cursor {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </defs>

  <!-- Window Container with Rounded Clip -->
  <g clip-path="url(#window-clip)">
    <!-- Terminal Body Background -->
    <rect x="1" y="1" width="678" height="358" fill="url(#window-gradient)" />

    <!-- Terminal Header Bar Background -->
    <rect x="1" y="1" width="678" height="37" fill="url(#header-gradient)" />

    <!-- Subtle Divider between Title Bar and Body -->
    <line x1="1" y1="38" x2="679" y2="38" stroke="#232834" stroke-width="1" />
  </g>

  <!-- macOS-style Traffic Light Buttons -->
  <g>
    <!-- Close -->
    <circle cx="22" cy="19" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <!-- Minimize -->
    <circle cx="38" cy="19" r="5.5" fill="#febc2e" stroke="#d89e24" stroke-width="0.5" />
    <!-- Maximize -->
    <circle cx="54" cy="19" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  </g>

  <!-- Centered Terminal Window Title -->
  <text x="340" y="23.5" class="term-title" text-anchor="middle">sumit0xff@arch: ~</text>

  <!-- Outer Window 1px Shell Border (Muted GitHub Dark Slate) -->
  <rect x="1" y="1" width="678" height="358" rx="10" ry="10" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- Subtle 1px Inner Highlight Bevel for Physical Depth -->
  <rect x="2" y="2" width="676" height="356" rx="9" ry="9" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Terminal Content Area -->
  <g class="term-text" xml:space="preserve">
    <!-- 1. Active Command Line -->
    <text x="26" y="72">
      <tspan class="prompt-user">sumit0xff</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">arch</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="cmd-bin">curl</tspan><tspan class="cmd-flag"> -s</tspan><tspan class="cmd-arg"> https://sumit0xff.vercel.app/api/status</tspan>
    </text>

    <!-- 2. JSON Opening Bracket -->
    <text x="26" y="100" class="json-bracket">{</text>

    <!-- 3. Status Line (Green accent for healthy/online) -->
    <text x="42" y="124"><tspan class="json-key">"status"</tspan><tspan class="json-punct">: </tspan><tspan class="json-status">"online"</tspan><tspan class="json-punct">,</tspan></text>

    <!-- 4. Identity Line -->
    <text x="42" y="148"><tspan class="json-key">"identity"</tspan><tspan class="json-punct">: </tspan><tspan class="json-val">"sumit0xff"</tspan><tspan class="json-punct">,</tspan></text>

    <!-- 5. Role Line -->
    <text x="42" y="172"><tspan class="json-key">"role"</tspan><tspan class="json-punct">: </tspan><tspan class="json-val">"Backend &amp; Infrastructure Engineer"</tspan><tspan class="json-punct">,</tspan></text>

    <!-- 6. Focus Line (Array) -->
    <text x="42" y="196"><tspan class="json-key">"focus"</tspan><tspan class="json-punct">: </tspan><tspan class="json-bracket">[</tspan><tspan class="json-val">"distributed systems"</tspan><tspan class="json-punct">, </tspan><tspan class="json-val">"cloud security"</tspan><tspan class="json-punct">, </tspan><tspan class="json-val">"Go"</tspan><tspan class="json-punct">, </tspan><tspan class="json-val">"Rust"</tspan><tspan class="json-bracket">]</tspan><tspan class="json-punct">,</tspan></text>

    <!-- 7. Uptime Line (Green accent matching online status) -->
    <text x="42" y="220"><tspan class="json-key">"uptime"</tspan><tspan class="json-punct">: </tspan><tspan class="json-uptime">"99.9%"</tspan><tspan class="json-punct">,</tspan></text>

    <!-- 8. Current Project Line -->
    <text x="42" y="244"><tspan class="json-key">"current_project"</tspan><tspan class="json-punct">: </tspan><tspan class="json-val">"see pinned repos"</tspan><tspan class="json-punct">,</tspan></text>

    <!-- 9. Message Line (Clear, punchy engineering quote) -->
    <text x="42" y="268"><tspan class="json-key">"message"</tspan><tspan class="json-punct">: </tspan><tspan class="json-quote">"Systems that don&apos;t fall over. That&apos;s the whole job."</tspan></text>

    <!-- 10. JSON Closing Bracket -->
    <text x="26" y="292" class="json-bracket">}</text>

    <!-- 11. Return Prompt with Blinking Block Cursor -->
    <text x="26" y="322">
      <tspan class="prompt-user">sumit0xff</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">arch</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="term-cursor">█</tspan>
    </text>
  </g>
</svg>
