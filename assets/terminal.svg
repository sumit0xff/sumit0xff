<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <defs>
    <!-- Pitch Black Background Gradients (No blue tint) -->
    <linearGradient id="window-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <linearGradient id="header-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121216" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <!-- Clip path for refined rounded corners -->
    <clipPath id="window-clip">
      <rect x="1" y="1" width="678" height="448" rx="10" ry="10" />
    </clipPath>

    <style>
      .term-text {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 24px;
        letter-spacing: 0.15px;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      .term-title {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Liberation Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 0.3px;
      }

      /* Command Line Styling */
      .prompt-user { fill: #7ee787; font-weight: 600; }
      .prompt-at   { fill: #6e7681; }
      .prompt-host { fill: #7ee787; font-weight: 500; }
      .prompt-colon{ fill: #6e7681; }
      .prompt-path { fill: #79c0ff; font-weight: 500; }
      .prompt-sym  { fill: #8b949e; font-weight: 600; }
      .cmd-bin     { fill: #f0883e; font-weight: 500; }

      /* Fastfetch Column Styling */
      .ff-label    { fill: #38bdf8; font-weight: 600; }
      .ff-val      { fill: #e6edf3; }
      .ff-dot      { fill: #6e7681; }

      /* Blinking Cursor */
      .term-cursor {
        fill: #58a6ff;
        animation: cursor-blink 1.05s step-end infinite;
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .term-cursor {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </defs>

  <!-- Window Container with Rounded Clip -->
  <g clip-path="url(#window-clip)">
    <!-- Pitch Black Terminal Body -->
    <rect x="1" y="1" width="678" height="448" fill="url(#window-gradient)" />

    <!-- Terminal Header Bar Background -->
    <rect x="1" y="1" width="678" height="37" fill="url(#header-gradient)" />

    <!-- Header Divider Line -->
    <line x1="1" y1="38" x2="679" y2="38" stroke="#1c1c22" stroke-width="1" />
  </g>

  <!-- macOS-style Traffic Light Buttons -->
  <g>
    <!-- Close -->
    <circle cx="22" cy="19" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <!-- Minimize -->
    <circle cx="38" cy="19" r="5.5" fill="#febc2e" stroke="#d89e24" stroke-width="0.5" />
    <!-- Maximize -->
    <circle cx="54" cy="19" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  </g>

  <!-- Centered Terminal Window Title -->
  <text x="340" y="23.5" class="term-title" text-anchor="middle">sumit0xff@arch: ~</text>

  <!-- Outer Window 1px Shell Border (Neutral Zinc/Carbon) -->
  <rect x="1" y="1" width="678" height="448" rx="10" ry="10" fill="none" stroke="#26262b" stroke-width="1" />

  <!-- Subtle 1px Inner Highlight Bevel for Physical Depth -->
  <rect x="2" y="2" width="676" height="446" rx="9" ry="9" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

  <!-- Terminal Content Area -->
  <g class="term-text" xml:space="preserve">
    <!-- 1. Active Command Line -->
    <text x="26" y="68">
      <tspan class="prompt-user">sumit0xff</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">arch</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="cmd-bin">fastfetch</tspan>
    </text>

    <!-- 2. Host Banner -->
    <text x="26" y="96">
      <tspan fill="#7ee787" font-weight="600">sumit0xff</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#58a6ff" font-weight="600">arch</tspan>
    </text>

    <!-- 3. Host Underline -->
    <text x="26" y="112" fill="#30363d">--------------</text>

    <!-- 4. OS -->
    <text x="26" y="136" class="ff-label">OS</text>
    <text x="142" y="136" class="ff-val"><tspan fill="#38bdf8" font-weight="500">Arch Linux</tspan> <tspan fill="#8b949e">x86_64</tspan></text>

    <!-- 5. Role -->
    <text x="26" y="160" class="ff-label">Role</text>
    <text x="142" y="160" class="ff-val"><tspan fill="#f0f6fc" font-weight="500">Full-Stack &amp; Infrastructure Engineer</tspan></text>

    <!-- 6. Core -->
    <text x="26" y="184" class="ff-label">Core</text>
    <text x="142" y="184" class="ff-val">JavaScript <tspan class="ff-dot">·</tspan> TypeScript <tspan class="ff-dot">·</tspan> HTML <tspan class="ff-dot">·</tspan> CSS <tspan class="ff-dot">·</tspan> SQL</text>

    <!-- 7. Frontend -->
    <text x="26" y="208" class="ff-label">Frontend</text>
    <text x="142" y="208" class="ff-val">React <tspan class="ff-dot">·</tspan> Next.js <tspan class="ff-dot">·</tspan> Tailwind CSS <tspan class="ff-dot">·</tspan> shadcn/ui</text>

    <!-- 8. Backend -->
    <text x="26" y="232" class="ff-label">Backend</text>
    <text x="142" y="232" class="ff-val">Node.js <tspan class="ff-dot">·</tspan> Bun <tspan class="ff-dot">·</tspan> Express <tspan class="ff-dot">·</tspan> REST <tspan class="ff-dot">·</tspan> WebSockets <tspan class="ff-dot">·</tspan> Zod</text>

    <!-- 9. Databases -->
    <text x="26" y="256" class="ff-label">Databases</text>
    <text x="142" y="256" class="ff-val">PostgreSQL <tspan class="ff-dot">·</tspan> MongoDB <tspan class="ff-dot">·</tspan> Prisma <tspan class="ff-dot">·</tspan> Drizzle</text>

    <!-- 10. Auth & Sec -->
    <text x="26" y="280" class="ff-label">Auth &amp; Sec</text>
    <text x="142" y="280" class="ff-val">JWT <tspan class="ff-dot">·</tspan> Authentication <tspan class="ff-dot">·</tspan> Rate Limiting <tspan class="ff-dot">·</tspan> CAPTCHA</text>

    <!-- 11. Infra & RT -->
    <text x="26" y="304" class="ff-label">Infra &amp; RT</text>
    <text x="142" y="304" class="ff-val">Redis <tspan class="ff-dot">·</tspan> WebRTC <tspan class="ff-dot">·</tspan> Queues <tspan class="ff-dot">·</tspan> Pub/Sub</text>

    <!-- 12. Architecture -->
    <text x="26" y="328" class="ff-label">Architecture</text>
    <text x="142" y="328" class="ff-val">Monorepos <tspan class="ff-dot">·</tspan> Turborepo <tspan class="ff-dot">·</tspan> SSR <tspan class="ff-dot">·</tspan> CSR <tspan class="ff-dot">·</tspan> SSG</text>

    <!-- 13. Systems -->
    <text x="26" y="352" class="ff-label">Systems</text>
    <text x="142" y="352" class="ff-val">Load Balancing <tspan class="ff-dot">·</tspan> Replication <tspan class="ff-dot">·</tspan> Sharding <tspan class="ff-dot">·</tspan> Scaling</text>

    <!-- 14. Fastfetch 8-Color Palette Palette Blocks -->
    <g transform="translate(142, 372)">
      <rect x="0" y="0" width="14" height="9" rx="2" fill="#21262d" />
      <rect x="18" y="0" width="14" height="9" rx="2" fill="#ff7b72" />
      <rect x="36" y="0" width="14" height="9" rx="2" fill="#7ee787" />
      <rect x="54" y="0" width="14" height="9" rx="2" fill="#f2cc60" />
      <rect x="72" y="0" width="14" height="9" rx="2" fill="#58a6ff" />
      <rect x="90" y="0" width="14" height="9" rx="2" fill="#bc8cff" />
      <rect x="108" y="0" width="14" height="9" rx="2" fill="#39c5cf" />
      <rect x="126" y="0" width="14" height="9" rx="2" fill="#f0f6fc" />
    </g>

    <!-- 15. Return Prompt with Blinking Block Cursor -->
    <text x="26" y="414">
      <tspan class="prompt-user">sumit0xff</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">arch</tspan><tspan class="prompt-colon">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan><tspan class="term-cursor">█</tspan>
    </text>
  </g>
</svg>
