<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%" height="330">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .terminal-window {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      }
      
      .prompt {
        fill: #8b949e;
        font-weight: 700;
      }
      
      .cmd {
        fill: #ffffff;
        font-weight: 500;
      }
      
      .key {
        fill: #79c0ff;
      }
      
      .val {
        fill: #a5d6ff;
      }
      
      .val-green {
        fill: #7ee787;
      }
      
      .bracket {
        fill: #d2a8ff;
      }
      
      .comma {
        fill: #7d8590;
      }
      
      .cursor {
        fill: #ffffff;
        animation: cursor-blink 0.8s step-end infinite;
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Non-looping entrance */
      .anim-cmd {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 0.2s forwards;
      }
      .anim-l1 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 0.4s forwards;
      }
      .anim-l2 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 0.6s forwards;
      }
      .anim-l3 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 0.8s forwards;
      }
      .anim-l4 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 1.0s forwards;
      }
      .anim-l5 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 1.2s forwards;
      }
      .anim-l6 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 1.4s forwards;
      }
      .anim-l7 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 1.6s forwards;
      }
      .anim-l8 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 1.8s forwards;
      }
      .anim-l9 {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 2.0s forwards;
      }
      .anim-end {
        opacity: 0;
        animation: reveal-line 0.3s ease-out 2.3s forwards;
      }

      @keyframes reveal-line {
        0% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-cmd, .anim-l1, .anim-l2, .anim-l3, .anim-l4, .anim-l5, .anim-l6, .anim-l7, .anim-l8, .anim-l9, .anim-end {
          opacity: 1 !important;
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Clean dark terminal container with neutral #30363d border (no purple shade) -->
  <rect x="1.5" y="1.5" width="697" height="327" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Header Bar -->
  <path d="M 2 10 Q 2 2 10 2 L 690 2 Q 698 2 698 10 L 698 36 L 2 36 Z" fill="#161b22" />
  <line x1="2" y1="36" x2="698" y2="36" stroke="#21262d" stroke-width="1" />
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />
  
  <!-- Terminal Title -->
  <text x="350" y="23" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12" font-weight="500" text-anchor="middle">sumit0xff@arch: ~</text>

  <!-- Terminal Content -->
  <g class="terminal-window" font-size="13" transform="translate(25, 66)">
    
    <!-- Command Line -->
    <g class="anim-cmd">
      <text y="0">
        <tspan class="prompt">sumit0xff@arch:~$</tspan>
        <tspan class="cmd"> curl -s https://sumit0xff.vercel.app/api/status</tspan>
      </text>
    </g>

    <!-- JSON Opening Bracket -->
    <g class="anim-l1">
      <text y="24"><tspan class="bracket">{</tspan></text>
    </g>

    <!-- Status Line -->
    <g class="anim-l2">
      <text y="46">  <tspan class="key">"status":</tspan> <tspan class="val-green">"online"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Identity Line -->
    <g class="anim-l3">
      <text y="68">  <tspan class="key">"identity":</tspan> <tspan class="val">"sumit0xff"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Role Line -->
    <g class="anim-l4">
      <text y="90">  <tspan class="key">"role":</tspan> <tspan class="val">"Backend &amp; Infrastructure Engineer"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Focus Line -->
    <g class="anim-l5">
      <text y="112">  <tspan class="key">"focus":</tspan> <tspan class="bracket">[</tspan><tspan class="val">"distributed systems"</tspan><tspan class="comma">, </tspan><tspan class="val">"cloud security"</tspan><tspan class="comma">, </tspan><tspan class="val">"Go"</tspan><tspan class="comma">, </tspan><tspan class="val">"Rust"</tspan><tspan class="bracket">]</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Uptime Line -->
    <g class="anim-l6">
      <text y="134">  <tspan class="key">"uptime":</tspan> <tspan class="val-green">"99.9%"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Current Project Line -->
    <g class="anim-l7">
      <text y="156">  <tspan class="key">"current_project":</tspan> <tspan class="val">"see pinned repos"</tspan><tspan class="comma">,</tspan></text>
    </g>

    <!-- Message Line -->
    <g class="anim-l8">
      <text y="178">  <tspan class="key">"message":</tspan> <tspan class="val">"Systems that don't fall over. That's the whole job."</tspan></text>
    </g>

    <!-- JSON Closing Bracket -->
    <g class="anim-l9">
      <text y="200"><tspan class="bracket">}</tspan></text>
    </g>

    <!-- Active Bottom Prompt with Blinking Cursor -->
    <g class="anim-end">
      <text y="234">
        <tspan class="prompt">sumit0xff@arch:~$</tspan>
        <tspan class="cursor" dx="8">█</tspan>
      </text>
    </g>

  </g>
</svg>
