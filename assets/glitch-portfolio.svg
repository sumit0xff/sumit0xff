<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" width="320" height="48">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;display=swap');

      .box {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 8px;
        transition: all 0.2s ease;
      }
      .text-base {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .label-base {
        fill: #ffffff;
      }
      .label-cyan {
        fill: #00ffff;
        opacity: 0.8;
        animation: glitch-cyan 2.8s infinite;
      }
      .label-purple {
        fill: #8968CD;
        opacity: 0.9;
        animation: glitch-purple 2.8s infinite;
      }
      @keyframes glitch-cyan {
        0%, 86%, 100% { transform: translate(0, 0); opacity: 0; }
        88% { transform: translate(-2.5px, -1px); opacity: 0.85; }
        91% { transform: translate(2.5px, 1px); opacity: 0.9; }
        93% { transform: translate(-3px, 0); opacity: 1; }
        95% { transform: translate(1.5px, -1px); opacity: 0.85; }
      }
      @keyframes glitch-purple {
        0%, 86%, 100% { transform: translate(0, 0); opacity: 0; }
        87% { transform: translate(2.5px, 1px); opacity: 0.9; }
        90% { transform: translate(-2.5px, -1px); opacity: 0.95; }
        92% { transform: translate(3px, 0); opacity: 1; }
        94% { transform: translate(-1.5px, 1px); opacity: 0.9; }
      }
    </style>
  </defs>

  <rect class="box" x="1" y="1" width="318" height="46" />
  
  <g class="text-base" transform="translate(160, 24)">
    <text class="label-cyan">sumit0xff.vercel.app ↗</text>
    <text class="label-purple">sumit0xff.vercel.app ↗</text>
    <text class="label-base">sumit0xff.vercel.app ↗</text>
  </g>
</svg>
