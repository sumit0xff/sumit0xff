<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 80" width="100%" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
      
      .text-container {
        font-family: 'Fira Code', monospace, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 34px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }

      /* Base layer transition: swaps between 'who am i' and 'sumit0xff' */
      .phase-1 {
        animation: text-phase1 6s infinite;
      }
      .phase-2 {
        animation: text-phase2 6s infinite;
      }

      @keyframes text-phase1 {
        0%, 45% { opacity: 1; visibility: visible; }
        48%, 98% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }

      @keyframes text-phase2 {
        0%, 47% { opacity: 0; visibility: hidden; }
        50%, 95% { opacity: 1; visibility: visible; }
        98%, 100% { opacity: 0; visibility: hidden; }
      }

      /* Ghost layers RGB-split glitch keyframes */
      .ghost-cyan {
        fill: #00ffff;
        opacity: 0.75;
        animation: glitch-cyan 6s infinite;
      }
      .ghost-magenta {
        fill: #ff00ff;
        opacity: 0.75;
        animation: glitch-magenta 6s infinite;
      }
      .base-text {
        fill: #ffffff;
      }

      @keyframes glitch-cyan {
        0%, 38%, 48%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
        40% { transform: translate(-3px, -1.5px); opacity: 0.85; }
        42% { transform: translate(3px, 1.5px); opacity: 0.9; }
        44% { transform: translate(-4px, 2px); opacity: 1; }
        46% { transform: translate(4px, -1px); opacity: 0.85; }
        90% { transform: translate(-3px, -2px); opacity: 0.85; }
        92% { transform: translate(3px, 1px); opacity: 0.9; }
        94% { transform: translate(-2px, 0); opacity: 1; }
        96% { transform: translate(3px, -1.5px); opacity: 0.85; }
      }

      @keyframes glitch-magenta {
        0%, 38%, 48%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
        39% { transform: translate(3px, 1.5px); opacity: 0.85; }
        41% { transform: translate(-3px, -1.5px); opacity: 0.9; }
        43% { transform: translate(4px, 0); opacity: 1; }
        45% { transform: translate(-3px, 2px); opacity: 0.85; }
        89% { transform: translate(3px, 2px); opacity: 0.85; }
        91% { transform: translate(-3px, -1px); opacity: 0.9; }
        93% { transform: translate(4px, 1px); opacity: 1; }
        95% { transform: translate(-2px, -2px); opacity: 0.85; }
      }
    </style>
  </defs>

  <g class="text-container" transform="translate(350, 40)">
    <!-- Phase 1: who am i -->
    <g class="phase-1">
      <text class="ghost-cyan">who am i ?</text>
      <text class="ghost-magenta">who am i ?</text>
      <text class="base-text">who am i ?</text>
    </g>

    <!-- Phase 2: sumit0xff -->
    <g class="phase-2">
      <text class="ghost-cyan">&gt; sumit0xff &lt;</text>
      <text class="ghost-magenta">&gt; sumit0xff &lt;</text>
      <text class="base-text">&gt; sumit0xff &lt;</text>
    </g>
  </g>
</svg>
