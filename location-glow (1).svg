<svg width="500" height="30" viewBox="0 0 500 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur">
        <animate attributeName="stdDeviation" values="1;3.5;1" dur="4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="250" y="20" font-family="Fira Code, monospace" font-size="14" fill="#ffffff" text-anchor="middle" filter="url(#glow2)">
    <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.2;0.25;0.45;0.5;1" dur="8s" repeatCount="indefinite"/>
    $ locate --user
  </text>
  <text x="250" y="20" font-family="Fira Code, monospace" font-size="14" fill="#ffffff" text-anchor="middle" filter="url(#glow2)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.45;0.5;1" dur="8s" repeatCount="indefinite"/>
    404: City Not Found
  </text>
  <text x="250" y="20" font-family="Fira Code, monospace" font-size="14" fill="#ffffff" text-anchor="middle" filter="url(#glow2)">
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.45;0.5;0.55;0.6;1" dur="8s" repeatCount="indefinite"/>
    127.0.0.1 (localhost)
  </text>
</svg>
